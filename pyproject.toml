[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubevram"
version = "0.1.0"
description = "Terminal-centric Kubernetes GPU & LLM inference operations CLI: Linux-to-K8s bridge, CUDA VRAM vs. K8s OOM triage, vLLM KV-cache tuner, and MIG/MPS advisor."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Pawel (xsub)" }
]
keywords = ["kubernetes", "gpu", "nvidia", "vllm", "llm-inference", "dcgm", "mig", "cli", "sre"]
dependencies = []

[project.urls]
Homepage = "https://github.com/xsub/KubeVRAM"
Repository = "https://github.com/xsub/KubeVRAM"
Issues = "https://github.com/xsub/KubeVRAM/issues"

[project.optional-dependencies]
live = [
  "kubernetes>=29.0.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
kubevram = "kubevram.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kubevram*"]
